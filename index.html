<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Frontend</title>
    <!-- ConfigCat SDK para el Feature Flag -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/configcat-js@8/dist/configcat.min.js"></script>
    <script src="script.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f8f9fa; }
        .calculadora { border: 1px solid #ddd; padding: 20px; max-width: 360px; border-radius: 8px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { margin-bottom: 10px; width: 92%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button { padding: 10px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-suma { background-color: #007bff; }
        .btn-suma:hover { background-color: #0056b3; }
        .btn-resta { background-color: #dc3545; }
        .btn-resta:hover { background-color: #c82333; }
        .btn-mult { background-color: #28a745; }
        .btn-mult:hover { background-color: #218838; }
        .btn-div { background-color: #fd7e14; }
        .btn-div:hover { background-color: #e06909; }
        .flag-status { margin-bottom: 12px; padding: 6px 10px; border-radius: 4px; font-size: 12px; background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .historial-box { margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .historial-box ul { list-style-type: disc; padding-left: 20px; max-height: 120px; overflow-y: auto; font-size: 13px; color: #333; }
        .btn-clear { background-color: #6c757d; font-size: 11px; padding: 5px 8px; margin-top: 5px; }
        .btn-clear:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="calculadora">
        <h2>Calculadora</h2>
        <div id="flagStatus" class="flag-status">
            🚦 Feature Flag: <strong>100% Rollout Activo</strong> (Todas las operaciones habilitadas)
        </div>

        <input type="number" id="numA" placeholder="Número A">
        <input type="number" id="numB" placeholder="Número B">
        
        <div class="btn-grid">
            <button class="btn-suma" onclick="calcularSuma()">Sumar (+)</button>
            <button id="btnResta" class="btn-resta" onclick="calcularResta()">Restar (-)</button>
            <button id="btnMultiplicar" class="btn-mult" onclick="calcularMultiplicacion()">Multiplicar (*)</button>
            <button id="btnDividir" class="btn-div" onclick="calcularDivision()">Dividir (/)</button>
        </div>
        
        <h3 id="resultado">Resultado: </h3>

        <!-- Sección de Historial de Operaciones -->
        <div id="seccionHistorial" class="historial-box">
            <h4>Historial de Operaciones</h4>
            <ul id="listaHistorial"></ul>
            <button class="btn-clear" onclick="limpiarHistorial()">Limpiar Historial</button>
        </div>
    </div>
</body>
</html>
