<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Frontend</title>
    <!-- ConfigCat SDK para el Feature Flag -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/configcat-js@8/dist/configcat.min.js"></script>
    <script src="script.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .calculadora { border: 1px solid #ccc; padding: 20px; max-width: 300px; border-radius: 8px; }
        input { margin-bottom: 10px; width: 90%; padding: 8px; }
        button { padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #btnResta { background-color: #dc3545; display: none; } /* Oculto por defecto */
        #btnResta:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <div class="calculadora">
        <h2>Calculadora</h2>
        <input type="number" id="numA" placeholder="Número A">
        <input type="number" id="numB" placeholder="Número B">
        
        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <button onclick="calcularSuma()">Sumar (+)</button>
            <!-- Este botón se mostrará solo si el Feature Flag está encendido en ConfigCat -->
            <button id="btnResta" onclick="calcularResta()">Restar (-)</button>
        </div>
        
        <h3 id="resultado">Resultado: </h3>
    </div>
</body>
</html>
